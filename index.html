<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Escalation Project</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');
        
        :root {
            --bg-color: #f0f4f8;
            --text-color: #111;
            --trunk-color: #333;
        }
        
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #eee; 
            --trunk-color: #00ffcc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* --- Landing Page Styles --- */
        #landing-page {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); z-index: 500;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; transition: opacity 0.5s ease;
        }
        #landing-page h1 {
            font-size: 3rem; margin-bottom: 2rem; color: var(--text-color); text-align: center;
        }
        .conflict-btn {
            padding: 15px 40px; margin: 10px; font-size: 1.5rem; font-weight: 700;
            font-family: inherit; cursor: pointer; border: none; border-radius: 8px;
            transition: transform 0.2s, background-color 0.3s; color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-us-iran { background-color: #444; }
        .btn-saudi-houthi { background-color: #666; }
        .conflict-btn:hover { transform: scale(1.05); }

        body.dark-mode #landing-page { background-color: #121212; }
        body.dark-mode #landing-page h1 { color: #fff; }

        /* --- Main Timeline Styles --- */
        #main-content { display: none; }

        .bg-flags {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; display: flex; pointer-events: none;
        }
        .bg-left, .bg-right {
            width: 50%; height: 100%; background-size: cover; background-position: center;
            opacity: 0.15; transition: opacity 0.5s;
        }
        body.dark-mode .bg-left, body.dark-mode .bg-right { opacity: 0.05; }

        /* Buttons Top Right */
        .top-right-controls {
            position: fixed; top: 20px; right: 20px; z-index: 200;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
        }
        
        .last-updated {
            font-size: 0.75rem; font-weight: 700; color: #333;
            background: rgba(255, 255, 255, 0.8); padding: 6px 12px;
            border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        body.dark-mode .last-updated { color: #eee; background: rgba(40, 40, 40, 0.8); }

        .control-btn {
            padding: 8px 12px; background: #333; color: #fff; border: none;
            border-radius: 5px; cursor: pointer; font-family: inherit;
            font-weight: bold; font-size: 0.8rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .control-btn:hover { background: #555; }

        /* Top Left Info Panel */
        #info-panel {
            position: fixed; top: 20px; left: 20px; z-index: 250;
            background: rgba(255, 255, 255, 0.95); padding: 12px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 0.75rem; max-width: 250px; display: none; color: #111;
        }
        body.dark-mode #info-panel { background: rgba(30, 30, 30, 0.95); color: #fff; }
        .info-line { margin-bottom: 5px; font-weight: 700; }
        
        .info-button-container { position: relative; margin-top: 8px; }
        .info-button {
            background: #444; color: #fff; padding: 6px 8px; border-radius: 4px;
            cursor: pointer; text-align: center; font-weight: bold; user-select: none;
            transition: background-color 0.2s;
        }
        .info-button:hover, .info-button-container.pinned .info-button {
            background: #222; color: #00ffcc;
        }

        .info-tooltip {
            visibility: hidden; position: absolute; top: calc(100% + 4px); left: 0;
            background: #1e1e1e; color: #fff; padding: 16px 18px; border-radius: 8px;
            width: 360px; max-height: 55vh; overflow-y: auto; font-size: 0.8rem;
            line-height: 1.5; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            border: 1px solid #444; z-index: 400; opacity: 0; transition: 0.2s ease;
        }
        .info-tooltip::before {
            content: ''; position: absolute; top: -12px; left: 0; width: 100%; height: 16px; background: transparent;
        }
        .info-button-container:hover .info-tooltip,
        .info-button-container.pinned .info-tooltip {
            visibility: visible; opacity: 1; pointer-events: auto;
        }
        
        /* --- Playing Cards Decks --- */
        .decks-wrapper {}
        .deck-left, .deck-right {
            position: fixed; top: 210px; bottom: 20px; width: 130px; 
            z-index: 150; display: flex; flex-direction: column; gap: 15px; 
            overflow-y: auto; overflow-x: visible; padding: 20px; 
            box-sizing: content-box;
        }
        .deck-left::-webkit-scrollbar, .deck-right::-webkit-scrollbar { display: none; }
        .deck-left { left: 0; }
        .deck-right { right: 0; }

        .deck-heading {
            text-align: center; font-size: 0.75rem; font-weight: 900;
            color: var(--text-color); margin-bottom: 10px; background: rgba(255, 255, 255, 0.8);
            padding: 8px; border-radius: 6px; border: 2px solid #ccc;
        }
        body.dark-mode .deck-heading { background: rgba(30, 30, 30, 0.9); border-color: #555; }

        /* NEUMORPHIC CARD STYLE WITH EXPANDING HOVER */
        .playing-card, .card {
            position: relative; width: 100%; min-height: 60px; 
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            color: #111; border-radius: 8px; padding: 15px; box-sizing: border-box;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.1), -4px -4px 10px rgba(255,255,255,0.8);
            font-size: 0.7rem; font-weight: 700; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid rgba(200, 200, 200, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; 
        }
        body.dark-mode .playing-card, body.dark-mode .card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a); color: #f0f0f0;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.6), -4px -4px 10px rgba(60,60,60,0.3);
            border-color: rgba(60, 60, 60, 0.5); 
        }
        
        .left-playing-card, .left-card { border-left: 8px solid #ff3333; }
        body.dark-mode .left-playing-card, body.dark-mode .left-card { border-left-color: #ff3333; }
        .left-playing-card:hover, .left-card:hover { 
            transform: scale(1.15) translateX(8px); border: 4px solid #ff3333 !important; 
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.8), inset 0 0 15px rgba(255, 51, 51, 0.2);
            background: #fffafa; z-index: 200;
        }
        
        .right-playing-card, .right-card { border-right: 8px solid #3366ff; } 
        body.dark-mode .right-playing-card, body.dark-mode .right-card { border-right-color: #3366ff; }
        .right-playing-card:hover, .right-card:hover { 
            transform: scale(1.15) translateX(-8px); border: 4px solid #3366ff !important;
            box-shadow: 0 0 30px rgba(51, 102, 255, 0.8), inset 0 0 15px rgba(51, 102, 255, 0.2);
            background: #fafcff; z-index: 200;
        }
        
        body.dark-mode .left-playing-card:hover, body.dark-mode .left-card:hover { background: #2b1111; }
        body.dark-mode .right-playing-card:hover, body.dark-mode .right-card:hover { background: #111a2b; }

        /* MAJOR EVENT STANDOUT STYLE */
        .major-event-card {
            background: linear-gradient(145deg, #fffde7, #fff9c4) !important;
            border: 4px solid #ffbc00 !important;
            box-shadow: 0 0 25px rgba(255, 188, 0, 0.6), inset 0 0 10px rgba(255, 188, 0, 0.2) !important;
            color: #333 !important;
            z-index: 50;
        }
        body.dark-mode .major-event-card {
            background: linear-gradient(145deg, #4a3b00, #2b2200) !important;
            border: 4px solid #ffbc00 !important;
            box-shadow: 0 0 25px rgba(255, 188, 0, 0.5) !important;
            color: #fff !important;
        }
        .major-event-card:hover {
            transform: scale(1.15) translateY(-5px) !important;
            box-shadow: 0 0 40px rgba(255, 188, 0, 1), inset 0 0 20px rgba(255, 188, 0, 0.5) !important;
            z-index: 200 !important;
        }
        
        .playing-card::after {
            content: '👁 View Media'; position: absolute; bottom: -12px; right: 5px;
            font-size: 0.5rem; background: #333; color: #fff; padding: 4px 6px;
            border-radius: 4px; opacity: 0; transition: opacity 0.2s; white-space: nowrap;
        }
        .playing-card:hover::after { opacity: 1; }

        /* --- Timeline & Events --- */
        .container {
            position: relative; max-width: 900px; margin: 0 auto;
            /* Extra buffer ensures bottom items scroll far above the fixed dashboard */
            padding: 220px 180px 350px 180px; 
        }
        .trunk {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 6px;
            background-color: var(--trunk-color); transform: translateX(-50%);
            box-shadow: 0 0 15px var(--trunk-color);
        }

        .event-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 80px; position: relative; width: 100%; z-index: 10;
        }

        .date {
            position: absolute; left: 50%; transform: translateX(-50%);
            background: #222; padding: 4px 10px; border-radius: 12px;
            font-size: 0.7rem; font-weight: 700; color: #fff; z-index: 10;
            border: 1px solid #555; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .checkpoint-container {
            margin-bottom: 80px; position: relative; width: 100%;
            display: flex; justify-content: center; z-index: 10;
        }
        .checkpoint {
            background: #ffcc00; color: #000; padding: 10px 20px; border-radius: 8px;
            font-weight: 900; text-align: center; z-index: 10;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.5); border: 2px solid #333;
        }
        .checkpoint.history-checkpoint {
            background: #e0e0e0; border-color: #999; color: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        body.dark-mode .checkpoint.history-checkpoint { background: #333; color: #eee; border-color: #555; }
        .checkpoint-days { font-size: 0.8rem; font-weight: 700; margin-top: 5px; color: #333; }
        body.dark-mode .checkpoint.history-checkpoint .checkpoint-days, 
        .checkpoint.history-checkpoint a { color: #555; }
        body.dark-mode .checkpoint.history-checkpoint a { color: #ccc; }

        .card { width: 42%; font-size: 0.85rem; }
        .common-card { width: 60%; margin: 0 auto; border: 3px solid #888; border-left: 3px solid #888; border-right: 3px solid #888; z-index: 15; }
        .common-card:hover { transform: scale(1.05); border: 3px solid #00ffcc !important; box-shadow: 0 0 20px rgba(0,255,204,0.5); }
        .card.blank { background: transparent; box-shadow: none; border: 2px dashed rgba(150,150,150,0.5); cursor: default; }
        .card.blank:hover { transform: none; box-shadow: none; border: 2px dashed rgba(150,150,150,0.5) !important; background: transparent; }
        
        /* Interactive Score Button inside Timeline Cards */
        .score-btn {
            margin-top: 15px; background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.15);
            padding: 8px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 900;
            color: #555; cursor: pointer; transition: all 0.2s; width: fit-content;
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        body.dark-mode .score-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #ddd; }
        .score-btn:hover { background: #00ffcc; color: #000; border-color: #00ffcc; transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,255,204,0.4); }

        .event-id {
            position: absolute; bottom: 5px; font-size: 0.65rem; color: #777;
            font-weight: 900; background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px;
        }
        body.dark-mode .event-id { background: rgba(255,255,255,0.1); color: #ccc; }
        .left-card .event-id { right: 8px; } .right-card .event-id { left: 8px; }
        
        .tooltip {
            visibility: hidden; background-color: #333; color: #fff; text-align: center;
            border-radius: 6px; padding: 10px; position: absolute; z-index: 250;
            bottom: calc(100% + 15px); left: 50%; transform: translateX(-50%);
            opacity: 0; transition: opacity 0.3s; width: 220px; font-size: 0.8rem; font-weight: 400; pointer-events: none;
        }
        .tooltip a { color: #00ffcc; text-decoration: underline; pointer-events: auto;}
        .tooltip::after { content: ''; position: absolute; top: 100%; left: 0; width: 100%; height: 15px; background: transparent; }
        .card:hover:not(.blank) .tooltip { visibility: visible; opacity: 1; pointer-events: auto; }

        /* --- FIXED FOOTER DASHBOARD --- */
        .footer {
            position: fixed; bottom: 0; left: 0; width: 100vw;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px 20px; background: rgba(255,255,255,0.95);
            border-top: 3px solid #ccc; box-sizing: border-box; z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
        }
        body.dark-mode .footer { background: rgba(15,15,15,0.95); border-top: 3px solid #333; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        
        .footer-metrics {
            display: flex; width: 100%; max-width: 1200px; justify-content: space-between; align-items: center;
        }
        
        .footer-side { display: flex; flex-direction: column; align-items: center; width: 20%; }
        .footer-name { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .footer-left .footer-name { color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.2); }
        .footer-right .footer-name { color: #3366ff; text-shadow: 0 0 10px rgba(51,102,255,0.2); }
        
        .footer-pts {
            font-size: 0.8rem; font-weight: 700; color: #555; background: rgba(0,0,0,0.05);
            padding: 2px 8px; border-radius: 20px; margin-top: 3px; border: 1px solid #ccc;
        }
        body.dark-mode .footer-pts { color: #ccc; background: rgba(255,255,255,0.1); border-color: #555; }

        .leverage-container {
            flex: 1; margin: 0 20px; display: flex; flex-direction: column; align-items: center;
        }
        .leverage-title {
            font-size: 0.75rem; font-weight: 900; color: #777; margin-bottom: 4px; letter-spacing: 2px;
        }
        
        /* DYNAMIC METER ANIMATIONS */
        .leverage-bar-wrapper {
            width: 100%; height: 20px; background: #222; border-radius: 20px; overflow: hidden;
            display: flex; box-shadow: inset 0 3px 10px rgba(0,0,0,0.8), 0 0 5px rgba(255,255,255,0.1); 
            border: 2px solid #444; position: relative;
        }
        
        .lev-fill-left {
            height: 100%; 
            background: linear-gradient(90deg, #880000, #ff2222, #ff6666, #ff2222, #880000);
            background-size: 200% 100%;
            animation: energy-push-left 1.5s infinite linear;
            display: flex; align-items: center; justify-content: flex-start; padding-left: 10px;
            font-weight: 900; font-size: 0.75rem; color: white; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box; text-shadow: 0 2px 4px rgba(0,0,0,0.9); overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        .lev-fill-right {
            height: 100%; 
            background: linear-gradient(90deg, #002288, #2255ff, #6699ff, #2255ff, #002288);
            background-size: 200% 100%;
            animation: energy-push-right 1.5s infinite linear;
            display: flex; align-items: center; justify-content: flex-end; padding-right: 10px;
            font-weight: 900; font-size: 0.75rem; color: white; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box; text-shadow: 0 2px 4px rgba(0,0,0,0.9); overflow: hidden;
            box-shadow: 0 0 15px rgba(51, 102, 255, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        @keyframes energy-push-left {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
        @keyframes energy-push-right {
            0% { background-position: -100% 0; }
            100% { background-position: 100% 0; }
        }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

        /* --- OVERLAYS & MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            z-index: 3000; display: none; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .close-modal {
            position: absolute; top: 20px; right: 30px; font-size: 2.5rem;
            color: white; cursor: pointer; z-index: 3010;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5); transition: color 0.2s;
        }
        .close-modal:hover { color: #ff3333; }
        
        .modal-content-wrapper {
            width: 85vw; height: 75vh; border: 3px solid #00ffcc;
            border-radius: 12px; background: #111; box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative; touch-action: none;
        }
        #modal-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: grab; transform-origin: top left; }
        #modal-img:active { cursor: grabbing; }
        #modal-video { width: 100%; height: 100%; object-fit: contain; }

        .modal-controls { margin-top: 20px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; z-index: 3010; }
        .modal-controls button, .modal-controls a {
            padding: 10px 20px; background: #333; color: #fff; border: 1px solid #555;
            border-radius: 6px; cursor: pointer; text-decoration: none; font-family: inherit;
            font-weight: bold; font-size: 0.9rem; transition: background 0.2s, transform 0.1s;
        }
        .modal-controls button:hover, .modal-controls a:hover { background: #555; }
        .modal-controls button:active, .modal-controls a:active { transform: scale(0.95); }
        .modal-controls a.download-btn { background: #ffcc00; color: #000; border: none; box-shadow: 0 4px 10px rgba(255,204,0,0.3); }
        .modal-controls a.download-btn:hover { background: #ffdd33; }

        /* SCORE POPUP SPECIFICS */
        .score-wrapper {
            background: #1a1a1a; border: 2px solid #00ffcc; border-radius: 15px;
            padding: 30px; width: 90vw; max-width: 450px; text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8); position: relative; z-index: 3010;
        }
        .icon-btn {
            background: #333; color: #fff; border: 1px solid #555; border-radius: 50%;
            width: 45px; height: 45px; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); }
        input[type=range] { -webkit-appearance: none; width: 60%; background: transparent; margin: 0 15px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 28px; width: 28px; border-radius: 50%;
            background: #00ffcc; cursor: pointer; margin-top: -10px; box-shadow: 0 0 15px #00ffcc;
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #444; border-radius: 4px; }
        .num-btn {
            background: #333; color: #fff; border: 1px solid #555; border-radius: 6px;
            width: 38px; height: 38px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .num-btn:hover, .num-btn.active { background: #00ffcc; color: #000; border-color: #00ffcc; transform: scale(1.1); }
        .submit-btn {
            background: #00ffcc; color: #000; font-size: 1.2rem; font-weight: bold;
            padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4); transition: transform 0.2s; margin-top: 10px; width: 100%;
        }
        .submit-btn:active { transform: scale(0.95); }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 900px) {
            .top-right-controls {
                position: relative; flex-direction: row; justify-content: center; align-items: center;
                flex-wrap: wrap; gap: 8px; top: 0; right: 0; padding-top: 15px; width: 100%;
            }
            .last-updated { width: 100%; text-align: center; margin-bottom: 5px; box-shadow: none; background: transparent; }
            .control-btn { font-size: 0.65rem; padding: 5px 8px; }
            #info-panel { position: relative; top: 0; left: 0; max-width: 90%; margin: 15px auto; padding: 12px; z-index: 250; }
            .info-tooltip { width: 85vw; max-width: 350px; font-size: 0.75rem; left: 50%; transform: translateX(-50%); }
            
            .decks-wrapper { display: flex; flex-direction: column; gap: 8px; width: 100%; padding-top: 5px; overflow: hidden; }
            .deck-left, .deck-right {
                position: relative; top: auto; left: auto; right: auto; bottom: auto; transform: none; width: 100%;
                flex-direction: row; align-items: center; overflow-x: auto; padding: 15px; box-sizing: border-box; z-index: 150;
            }
            .deck-left::-webkit-scrollbar, .deck-right::-webkit-scrollbar { display: block; height: 4px; }
            .deck-left::-webkit-scrollbar-thumb, .deck-right::-webkit-scrollbar-thumb { background: #888; border-radius: 2px; }
            
            .deck-heading { margin: 0 12px 0 0; font-size: 0.7rem; padding: 8px 10px; flex-shrink: 0; }
            .playing-card {
                min-width: 100px; max-width: 120px; min-height: 50px; padding: 8px; margin-right: 12px;
                font-size: 0.65rem; line-height: 1.2; flex-shrink: 0;
            }
            .left-playing-card:hover, .right-playing-card:hover { transform: scale(1.05) translateY(-4px); }

            .container { padding: 20px 8px 350px 8px; max-width: 100%; } 
            .event-container { position: relative; padding-top: 30px; margin-bottom: 55px; } 
            .date { top: 0; left: 50%; transform: translateX(-50%); font-size: 0.65rem; padding: 3px 8px; }

            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);

                    if(hasLeftText) {
                        let leftRefHtml = evt.leftRef ? `<a href="${evt.leftRef}" target="_blank">${evt.leftRefTitle || 'Source Article'}</a>` : 'News Links & Refs Coming Soon';
                        let scoreHtml = `<div class="score-btn" onclick="openScorePopup('${zoneId}', 'left', ${idx}, event)">⭐ Score: <span id="score-left-${idx}">${userScores[`${zoneId}-left-${idx}`] || 0}</span>/10</div>`;
                        leftCard.innerHTML = `<p>${evt.left}</p><span class="event-id">${leftPrefix}.${leftCount}</span><span class="tooltip">${leftRefHtml}</span>${scoreHtml}`;
                        leftCard.onmouseenter = playSound; leftCount--;
                    }

                    const dateLabel = document.createElement('div');
                    dateLabel.className = 'date'; dateLabel.innerText = evt.date;

                    const rightCard = document.createElement('div');
                    const hasRightText = evt.right && evt.right.trim() !== "";
                    rightCard.className = `card right-card ${!hasRightText ? 'blank' : ''} ${evt.isMajorRight ? 'major-event-card' : ''}`;
                    if(hasRightText) {
                        let rightRefHtml = evt.rightRef ? `<a href="${evt.rightRef}" target="_blank">${evt.rightRefTitle || 'Source Article'}</a>` : 'News Links & Refs Coming Soon';
                        let scoreHtml = `<div class="score-btn" onclick="openScorePopup('${zoneId}', 'right', ${idx}, event)">⭐ Score: <span id="score-right-${idx}">${userScores[`${zoneId}-right-${idx}`] || 0}</span>/10</div>`;
                        rightCard.innerHTML = `<p>${evt.right}</p><span class="event-id">${rightPrefix}.${rightCount}</span><span class="tooltip">${rightRefHtml}</span>${scoreHtml}`;
                        rightCard.onmouseenter = playSound; rightCount--;
                    }

                    row.appendChild(leftCard); row.appendChild(dateLabel); row.appendChild(rightCard);
                    timelineContainer.appendChild(row);
                }
            });

            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            
            calculateLeverage(zoneId);
        }

        function showLanding() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('landing-page').style.display = 'flex';
        }

        document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('dark-mode'); });

        /* --- PARTICLES --- */
        const canvas = document.getElementById('particles'); const ctx = canvas.getContext('2d');
        const particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth; this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 3 + 1; this.speedY = Math.random() * -1 - 0.5;
            }
            update() {
                this.y += this.speedY;
                if(this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('dark-mode') ? 'rgba(0, 255, 204, 0.5)' : 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for(let i = 0; i < 50; i++) particlesArray.push(new Particle());
        function animate() {
            if(document.getElementById('main-content').style.display === 'block') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particlesArray.forEach(p => { p.update(); p.draw(); });
            }
            requestAnimationFrame(animate);
        }
        animate();
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        /* --- INTERACTIVE LEVERAGE SCORING --- */
        function openScorePopup(zoneId, side, index, event) {
            event.stopPropagation();
            activeScoreContext = { zoneId, side, index };
            let currentScore = userScores[`${zoneId}-${side}-${index}`] || 0;
            document.getElementById('score-slider').value = currentScore;
            updateScoreDisplay(currentScore);
            document.getElementById('score-modal').style.display = 'flex';
        }

        function closeScoreModal() {
            document.getElementById('score-modal').style.display = 'none';
        }

        function adjustScore(delta) {
            let slider = document.getElementById('score-slider');
            let val = parseInt(slider.value) + delta;
            if(val < 0) val = 0; if(val > 10) val = 10;
            slider.value = val;
            updateScoreDisplay(val);
        }

        function setScore(val) {
            document.getElementById('score-slider').value = val;
            updateScoreDisplay(val);
        }

        function updateScoreDisplay(val) {
            document.getElementById('score-display-val').innerText = val;
            document.querySelectorAll('.num-btn').forEach(btn => {
                if(parseInt(btn.innerText) === parseInt(val)) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function submitScore() {
            if(!activeScoreContext) return;
            let val = parseInt(document.getElementById('score-slider').value);
            let { zoneId, side, index } = activeScoreContext;
            
            userScores[`${zoneId}-${side}-${index}`] = val; 
            document.getElementById(`score-${side}-${index}`).innerText = val; 
            
            calculateLeverage(zoneId); 
            closeScoreModal();
        }

        function calculateLeverage(zoneId) {
            const data = conflictData[zoneId];
            
            let leftPoints = data.cardsLeft.length * 10;
            let rightPoints = data.cardsRight.length * 10;
            
            data.events.forEach((evt, idx) => {
                if (evt.type === 'event') {
                    if (evt.left && evt.left.trim() !== "") {
                        leftPoints += userScores[`${zoneId}-left-${idx}`] || 0;
                    }
                    if (evt.right && evt.right.trim() !== "") {
                        rightPoints += userScores[`${zoneId}-right-${idx}`] || 0;
                    }
                }
            });
            
            let totalPoints = leftPoints + rightPoints;
            let leftPct = totalPoints === 0 ? 50 : Math.round((leftPoints / totalPoints) * 100);
            let rightPct = totalPoints === 0 ? 50 : 100 - leftPct;
            
            document.getElementById('pts-left').innerText = `${leftPoints} pts (${leftPct}%)`;
            document.getElementById('pts-right').innerText = `${rightPoints} pts (${rightPct}%)`;
            
            document.getElementById('bar-left').style.width = `${leftPct}%`;
            document.getElementById('bar-left').innerText = `${leftPct}%`;
            document.getElementById('bar-right').style.width = `${rightPct}%`;
            document.getElementById('bar-right').innerText = `${rightPct}%`;
        }

        /* --- MEDIA MODAL PAN & ZOOM --- */
        const modal = document.getElementById('media-modal');
        const modalImg = document.getElementById('modal-img');
        const modalVideo = document.getElementById('modal-video');
        const modalWrapper = document.getElementById('modal-wrapper');
        const downloadBtn = document.getElementById('download-btn');
        const zoomControls = [document.getElementById('zoom-in-btn'), document.getElementById('zoom-out-btn'), document.getElementById('reset-zoom-btn')];

        let scale = 1; let panning = false; let pointX = 0; let pointY = 0; let start = { x: 0, y: 0 };

        function openMediaModal(type, src) {
            modal.style.display = 'flex';
            downloadBtn.href = src; 
            resetZoom();
            if (type === 'image') {
                modalImg.src = src; modalImg.style.display = 'block'; modalVideo.style.display = 'none';
                zoomControls.forEach(btn => btn.style.display = 'block');
            } else if (type === 'video') {
                modalVideo.src = src; modalVideo.style.display = 'block'; modalImg.style.display = 'none';
                zoomControls.forEach(btn => btn.style.display = 'none'); 
            }
        }

        function closeMediaModal() {
            modal.style.display = 'none';
            modalVideo.pause(); modalVideo.src = ""; modalImg.src = "";
        }

        function setTransform() { modalImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }

        function zoomImage(multiplier) {
            scale *= multiplier;
            if(scale < 0.5) scale = 0.5; if(scale > 10) scale = 10;
            setTransform();
        }

        function resetZoom() {
            scale = 1; pointX = 0; pointY = 0; setTransform();
        }

        // Mouse Pan & Zoom
        modalWrapper.onmousedown = function (e) {
            if(modalImg.style.display === 'none') return;
            e.preventDefault();
            start = { x: e.clientX - pointX, y: e.clientY - pointY }; panning = true;
        }
        modalWrapper.onmouseup = function (e) { panning = false; }
        modalWrapper.onmouseleave = function (e) { panning = false; }
        modalWrapper.onmousemove = function (e) {
            if (!panning || modalImg.style.display === 'none') return;
            e.preventDefault();
            pointX = (e.clientX - start.x); pointY = (e.clientY - start.y); setTransform();
        }
        modalWrapper.onwheel = function (e) {
            if(modalImg.style.display === 'none') return;
            e.preventDefault();
            let xs = (e.clientX - pointX) / scale, ys = (e.clientY - pointY) / scale;
            let delta = (e.wheelDelta ? e.wheelDelta : -e.deltaY);
            (delta > 0) ? (scale *= 1.1) : (scale /= 1.1);
            if(scale < 0.5) scale = 0.5; if(scale > 10) scale = 10;
            pointX = e.clientX - xs * scale; pointY = e.clientY - ys * scale; setTransform();
        }

        // Touch Pan
        modalWrapper.addEventListener('touchstart', function(e) {
            if(modalImg.style.display === 'none' || e.touches.length > 1) return;
            start = { x: e.touches[0].clientX - pointX, y: e.touches[0].clientY - pointY }; panning = true;
        }, {passive: true});
        modalWrapper.addEventListener('touchmove', function(e) {
            if (!panning || modalImg.style.display === 'none' || e.touches.length > 1) return;
            e.preventDefault();
            pointX = (e.touches[0].clientX - start.x); pointY = (e.touches[0].clientY - start.y); setTransform();
        }, {passive: false});
        modalWrapper.addEventListener('touchend', function(e) { panning = false; });

    </script>
</body>
</html>
